<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f2e5"><title>熊林洋的手绘书架</title><link rel="stylesheet" href="style.css"></head>
<body data-phase="loading">
<main id="shelf" aria-label="熊林洋的作品书架">
  <div id="stage"><canvas id="paper" aria-hidden="true"></canvas><div id="volumes"></div></div>
  <p id="hint" role="status">正在整理书架…</p>
</main>
<div id="scrim" hidden></div>
<section id="viewer" role="dialog" aria-modal="true" aria-label="书籍阅读" hidden>
 <button id="close" class="quiet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>放回书架</button>
 <div id="reading" inert>
   <div class="spread"><article id="left-page" class="page"></article><article id="right-page" class="page"></article></div>
   <footer><span id="page-label"></span><button id="finish" class="quiet">合上这本书<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></footer>
 </div>
 <button id="cover" aria-label="再次点击，翻开书籍"><div id="cover-board"><img id="cover-art" alt=""><div id="cover-type"><small></small><i></i><h1></h1><p>点击翻开</p></div></div></button>
 <div id="page-zoom" hidden><button class="quiet" id="zoom-left">放大左页</button><button class="quiet" id="zoom-reset">全书</button><button class="quiet" id="zoom-right">放大右页</button></div>
 <button id="watch-demo" class="quiet" hidden>▷ 实验演示</button>
 <button id="image-tab" hidden aria-label="跳到图片内容首页">图片</button>
 <button id="video-tab" hidden aria-label="跳到视频页">视频</button>
 <button id="play-creative-video" class="quiet" hidden>▷ 播放视频</button>
 <nav id="page-controls" hidden aria-label="翻页"><button id="prev-page" class="quiet">← 上一页</button><span id="page-position" aria-live="polite"></span><button id="next-page" class="quiet">下一页 →</button></nav>
 <p id="view-hint" aria-live="polite"></p>
</section>
<dialog id="demo-dialog" aria-labelledby="demo-title"><header><h2 id="demo-title">焰色反应 · 化学实验演示</h2><button id="close-demo" class="quiet" aria-label="关闭视频，回到书页">关闭 ×</button></header><video id="demo-video" controls playsinline preload="none" poster="assets/product/flame-poster.jpg">你的浏览器不支持视频播放。</video></dialog>
<script src="vendor/gsap.min.js"></script><script type="module" src="app.js"></script>
</body></html>
